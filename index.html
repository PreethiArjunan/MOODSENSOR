<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodSense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to MoodSense</h1>
    <p>Select your mood:</p>

    <div class="mood-buttons">
        <button onclick="playMood('happy')">Happy</button>
        <button onclick="playMood('sad')">Sad</button>
        <button onclick="playMood('angry')">Angry</button>
        <button onclick="playMood('chill')">Chill</button>
        <button onclick="playMood('love')">Love</button>
    </div>

    <audio id="moodAudio" controls></audio>

    <script src="script.js"></script>
</body>
</html>
