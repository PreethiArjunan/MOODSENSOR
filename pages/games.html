<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport"content="width=device-width,initial-scale=1"/>
<title>Games — MoodSense ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background:#0e0d13;
  color:#fff;
  overflow-x:hidden;
}

/* Sidebar */
.sidebar{
  position:fixed;left:15px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:20px;z-index:999;
}
.sidebar button{
  width:58px;height:58px;border-radius:16px;border:none;cursor:pointer;
  background:rgba(255,255,255,0.12);color:#fff;font-size:26px;
  display:flex;justify-content:center;align-items:center;transition:.25s;
}
.sidebar button:hover{background:#ffb7e7;color:#000;transform:scale(1.1);}
.sidebar .active{background:#ffb7e7!important;color:#000!important;}

/* Logout */
.sidebar .logout{background:rgba(255,150,200,0.22);}
.sidebar .logout:hover{background:#ff8ec9;color:#000;}

/* Page container */
.container{margin-left:120px;padding:40px;}

/* Cards */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px;
}
.card{
  background:linear-gradient(180deg,#2c1b2d,#704868);
  padding:14px;border-radius:14px;
  box-shadow:0 14px 26px rgba(255,185,230,0.25);
}

/* Game box */
.game-stage{
  background:rgba(255,255,255,0.15);
  border-radius:12px;padding:20px;min-height:120px;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
}

/* Buttons */
.btn{
  background:#ffc4e8;border:none;padding:8px 14px;border-radius:10px;
  cursor:pointer;font-weight:700;color:#000;
}
.btn:hover{background:#ff4fa8;color:#fff;}

/* Stress bubble */
#tapBubble{
  width:70px;height:70px;border-radius:50%;
  background:#ff9ccf;font-size:32px;display:flex;
  justify-content:center;align-items:center;cursor:pointer;
  transition:.1s;
}

/* Memory cards */
.mem-card{
  width:68px;height:68px;border-radius:10px;font-size:26px;
  background:linear-gradient(180deg,#fff6fb,#fff0f6);
}

/* Zen bubble */
.zen-bubble{
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle,#ffd8fe,#d38df5);
  box-shadow:0 0 18px #ffcefb;
  font-size:24px;display:flex;align-items:center;justify-content:center;
  position:absolute;cursor:pointer;opacity:0.92;
  transition:transform .2s;
}
.popAnime{animation:pop .3s ease-out forwards;}
@keyframes pop{100%{transform:scale(1.8);opacity:0;}}

/* Slime */
#slime{
  width:180px;height:120px;border-radius:150px;
  background:linear-gradient(145deg,#ffb8ec,#ff87dd);
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;transition:.2s;
  position:relative;overflow:hidden;
}
#slimeFace{font-size:38px;}
.sparkle{
  position:absolute;font-size:18px;
  animation:fade .8s forwards;
}
@keyframes fade{100%{opacity:0;transform:scale(1.6);}}

/* Rewards */
#rewards div{
  padding:8px 10px;background:#fff6fb;border-radius:10px;
  font-weight:700;color:#111;margin:4px 0;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <button onclick="location.href='index.html'">🏠</button>
  <button onclick="location.href='music.html'">🎧</button>
  <button class="active">🎮</button>
  <button onclick="location.href='profile.html'">👤</button>
  <button class="logout" onclick="logout()">🚪</button>
</div>

<div class="container">

<h1>Mini Games • MoodSense ✨</h1>

<div class="grid">

<!-- Tap Stress Ball -->
<div class="card">
  <h3>Tap Stress Ball 😣 ➜ 😊</h3>
  <div class="game-stage"><div id="tapBubble">😣</div></div>
  <button id="tapStart" class="btn">Start</button>
  <span id="tapScore" style="float:right;font-weight:700">0</span>
</div>

<!-- Memory Flip -->
<div class="card">
  <h3>Memory Flip 🧠💕</h3>
  <div id="memoryStage" class="game-stage" style="gap:6px;"></div>
  <button id="memStart" class="btn">New</button>
  <span id="memInfo" style="float:right;font-weight:700;">0 Matches</span>
</div>

<!-- Zen Bubble Garden -->
<div class="card">
  <h3>Zen Bubble Garden 🌸</h3>
  <div id="zenStage" class="game-stage" style="position:relative;height:200px;"></div>
  <button id="zenStart" class="btn">Start</button>
  <button id="zenStop" class="btn">Stop</button>
  <span id="zenScore" style="float:right;font-weight:700;">0</span>
</div>

<!-- Kawaii Slime Stretch -->
<div class="card">
  <h3>Kawaii Slime Stretch 🩷✨</h3>
  <div class="game-stage">
    <div id="slime">
      <div id="slimeFace">(*^▽^*)</div>
    </div>
  </div>
  <span style="font-size:14px;">Pull to relax 💞</span>
  <span id="slimeScore" style="float:right;font-weight:700;">0</span>
</div>

</div>

<h3>Recent Rewards ✨</h3>
<div id="rewards"></div>

</div>

<script type="module" src="../js/games.js"></script>

<script>
function logout(){
  localStorage.removeItem("moodsenseUser");
  alert("Logged out 💗");
  location.href="login.html";
}
</script>

</body>
</html>
