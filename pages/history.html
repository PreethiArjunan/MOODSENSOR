<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mood History — MoodSense (Luxury Romance)</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2pdf (export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

  <style>
    /* Luxury Romance theme */
    :root{
      --bg:#0e0c10;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --accent1:#f7c6d6; /* rose */
      --accent2:#d6b8ff; /* lavender */
      --gold: #d9b08c;
      --muted: rgba(255,255,255,0.15);
      --text:#f3eef7;
      --soft-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#08060a 0%,#0e0c10 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .page{max-width:1100px;margin:28px auto;padding:28px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .brand{font-weight:800;font-size:22px;color:var(--accent2)}
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#111;font-weight:700;border:none;cursor:pointer;box-shadow:0 8px 30px rgba(211,150,200,0.08)
    }
    .controls{display:flex;gap:12px;align-items:center}
    .seg{display:flex;gap:10px}
    .seg button{background:var(--glass);border-radius:12px;padding:10px 12px;color:var(--text);border:1px solid rgba(255,255,255,0.04);cursor:pointer}
    .seg button.active{box-shadow:0 10px 30px rgba(214,155,189,0.08);background:linear-gradient(90deg,var(--accent1),#ffe9f3);color:#111;font-weight:700}

    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:26px;margin-bottom:28px;box-shadow:var(--soft-shadow);border:1px solid rgba(255,255,255,0.03)}
    h1,h2{margin:0 0 12px}
    h1{font-size:32px}
    .row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
    .chart-card{flex:1;min-width:300px;padding:18px;background:rgba(255,255,255,0.02);border-radius:12px}
    canvas{display:block;width:100%;height:260px}

    /* Emoji timeline */
    #emojiTimeline{display:flex;gap:18px;align-items:center;justify-content:center;padding:14px;overflow-x:auto}
    .emoji-pill{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));cursor:pointer;border:2px solid transparent;transition:transform .18s,box-shadow .18s}
    .emoji-pill:hover{transform:translateY(-6px)}
    .emoji-pill .emoji{font-size:28px}
    .emoji-pill.selected{box-shadow:0 12px 30px rgba(213,140,180,0.15);border-color:var(--gold);transform:scale(1.04)}

    .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:10px}
    .legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:6px}

    .recent-list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
    .recent-item{display:flex;justify-content:space-between;padding:10px;border-radius:10px;background:rgba(255,255,255,0.02);align-items:center}
    .recent-item .left{display:flex;gap:12px;align-items:center}
    .recent-item .emoji{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#ffffff11,#00000020)}
    .muted{opacity:.65}

    /* responsive */
    @media(max-width:880px){
      .row{flex-direction:column}
      canvas{height:220px}
    }

    /* small pretty */
    .title-sub{color:var(--muted);font-size:14px;margin-top:6px}
    .export-note{font-size:13px;color:var(--muted);margin-left:12px}
    .profile-name{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,0.02)}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <div class="brand">MoodSense ✨</div>
        <div class="title-sub">Track vibes • export reports • see trends</div>
      </div>
      <div class="controls">
        <div class="profile-name" id="profileName">—</div>
        <div class="seg" role="tablist" aria-label="range">
          <button id="weekBtn">📅 Week</button>
          <button id="monthBtn">🗓️ Month</button>
          <button id="allBtn" class="active">♾️ All time</button>
        </div>
        <button class="btn" id="exportBtn">📄 Export PDF</button>
      </div>
    </header>

    <!-- Overview -->
    <section class="card">
      <h1>Mood Overview</h1>
      <div class="title-sub">Your emotional journey — insights over the last entries. Click an emoji in the timeline to highlight and export.</div>
    </section>

    <!-- Charts -->
    <section class="card">
      <h2>Mood Bar Chart</h2>
      <div class="row charts-row">
        <div class="chart-card">
          <div class="legend" id="legendLeft"></div>
          <canvas id="barChart" aria-label="mood bar chart"></canvas>
        </div>

        <div class="chart-card">
          <div class="legend" id="legendRight"></div>
          <canvas id="donutChart" aria-label="mood donut chart"></canvas>
        </div>
      </div>
    </section>

    <!-- Animated timeline -->
    <section class="card">
      <h2>Animated Mood Timeline ✨</h2>
      <div id="emojiTimeline" aria-live="polite">
        <!-- emojis inserted by JS -->
      </div>

      <div class="recent-list" id="recentList"></div>
    </section>
  </div>
<div class="romance-bg"></div>
<div id="heartContainer"></div>
  
<!-- history script -->
  <script type="module" src="../js/history.js"></script>
</body>
</html>
