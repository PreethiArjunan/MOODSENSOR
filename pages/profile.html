<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profile — MoodSense ✨</title>

  <link rel="stylesheet" href="../css/style.css"> <!-- keep your main css -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    /* BODY */
    body {
      background: linear-gradient(180deg,#0e0c10,#120f13);
      color:#fff;
      font-family: 'Poppins', system-ui, Segoe UI, Roboto;
      overflow-x:hidden;
    }

    /* CONTAINER */
    .container {
      max-width:920px;
      margin:36px auto;
      padding:20px;
      position:relative;
    }

    /* GLASS CARD */
    .card {
      background: rgba(255,255,255,0.02);
      border-radius:16px;
      padding:20px;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
      position:relative;
      backdrop-filter: blur(12px);
      margin-bottom:24px;
      transition:0.3s ease;
    }

    .card:hover { box-shadow:0 25px 70px rgba(255,200,230,0.15); }

    /* HEADER BOX */
    .head {
      display:flex;
      gap:18px;
      align-items:center;
      justify-content:space-between;
    }

    .profile-box {
      display:flex;
      gap:18px;
      align-items:center;
    }

    /* AVATAR */
    .avatar-wrap {
      width:120px;
      height:120px;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(90deg,#f7c6d6,#d6b8ff);
      box-shadow:0 18px 40px rgba(211,150,200,0.08);
      transition:0.3s ease;
    }

    .avatar-wrap:hover {
      box-shadow:0 0 40px rgba(247,198,214,0.6);
      transform: scale(1.05);
    }

    .avatar-wrap img {
      width:110px;
      height:110px;
      object-fit:cover;
      border-radius:12px;
    }

    /* INPUTS */
    .name-input {
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      padding:8px 12px;
      border-radius:10px;
      color:#fff;
      font-size:16px;
      font-weight:500;
    }

    .muted { opacity:.75; font-size:13px }

    /* BUTTONS */
    .btn {
      background: linear-gradient(90deg,#f7c6d6,#d6b8ff);
      color:#111;
      border:none;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      transition:0.3s ease;
    }
    .btn:hover { box-shadow:0 0 20px rgba(247,198,214,0.6); transform: translateY(-2px); }

    .small {
      padding:6px 10px;
      font-size:13px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      background:rgba(255,255,255,0.04);
      color:#fff;
      transition:0.3s ease;
    }
    .small:hover { box-shadow:0 0 12px rgba(255,255,255,0.1); }

    /* STATS */
    .stats {
      display:flex;
      gap:12px;
      margin-top:12px;
    }
    .stat {
      background:rgba(255,255,255,0.02);
      padding:10px 14px;
      border-radius:12px;
      text-align:center;
      transition:0.3s ease;
    }
    .stat:hover { box-shadow:0 0 16px rgba(247,198,214,0.4); }

    /* BADGES */
    .badges {
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .badge {
      background: linear-gradient(180deg,#fff6f9,#fff0f6);
      color:#111;
      padding:8px 10px;
      border-radius:10px;
      font-weight:700;
      box-shadow:0 8px 24px rgba(200,140,180,0.08);
      transition:0.3s ease;
    }
    .badge:hover { transform:translateY(-2px); box-shadow:0 0 16px rgba(255,200,230,0.3); }

    /* TEXTAREAS */
    textarea {
      width:100%;
      min-height:80px;
      border-radius:12px;
      padding:12px;
      background: rgba(255,255,255,0.02);
      border:none;
      color:#fff;
      font-size:15px;
      resize:none;
    }

    /* RESPONSIVE */
    @media(max-width:720px){
      .head{flex-direction:column;align-items:flex-start}
      .profile-box{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- PROFILE CARD -->
    <div class="card head">
      <div class="profile-box">
        <div class="avatar-wrap" id="avatarWrap">
          <img id="avatarImg" alt="avatar" src="">
        </div>

        <div>
          <div style="display:flex;gap:12px;align-items:center">
            <input id="displayName" class="name-input" placeholder="♡ USER A ♡" />
            <button id="saveName" class="btn">Save</button>
            <input id="avatarFile" type="file" accept="image/*" style="display:none" />
            <button id="uploadAvatar" class="small">Upload Avatar</button>
          </div>

          <div class="muted" style="margin-top:8px">Profile name appears on reports & share cards</div>

          <div class="stats">
            <div class="stat"><div id="streakNum" style="font-weight:800;font-size:18px">0</div><div class="muted">Streak</div></div>
            <div class="stat"><div id="xpNum" style="font-weight:800;font-size:18px">0</div><div class="muted">XP</div></div>
            <div class="stat"><div id="gamesPlayed" style="font-weight:800;font-size:18px">0</div><div class="muted">Games</div></div>
          </div>

          <div class="badges" id="badges">
            <!-- dynamic badges -->
          </div>
        </div>
      </div>

      <div style="text-align:right;">
        <div class="muted">MoodSense • Luxury Romance</div>
        <div style="margin-top:24px">
          <button id="exportProfile" class="btn">Share Profile 📷</button>
        </div>
      </div>
    </div>

    <!-- ABOUT CARD -->
    <div class="card">
      <h3 style="margin-top:0">About</h3>
      <textarea id="bio" placeholder="Write a small mood bio... (optional)"></textarea>
      <div style="margin-top:12px;display:flex;gap:10px">
        <button id="saveBio" class="btn">Save Bio</button>
        <button id="resetProfile" class="small">Reset Profile</button>
      </div>
    </div>

  </div>

  <script type="module" src="../js/profile.js"></script>
</body>
</html>
